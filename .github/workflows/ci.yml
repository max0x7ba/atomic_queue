name: Makefile Continuous Integrations

on:
  push:
    branches: [ master, maxim ]
    paths:
      - '**.h'
      - '**.cc'
      - Makefile
      - .github/workflows/ci.yml
  pull_request:
    branches: [ master ]
    paths:
      - '**.h'
      - '**.cc'
      - Makefile
      - .github/workflows/ci.yml

defaults:
  run:
    shell: bash

env:
  # Enable printf thousand separators.
  LC_NUMERIC: en_US.UTF-8

jobs:
  unit-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     toolset: gcc,   std: c++14 }
          - { os: ubuntu-24.04,     toolset: gcc,   std: c++20 }
          - { os: ubuntu-26.04,     toolset: gcc,   std: c++14 }
          - { os: ubuntu-26.04,     toolset: gcc,   std: c++23 }
          - { os: ubuntu-24.04-arm, toolset: gcc,   std: c++14 }
          - { os: ubuntu-24.04-arm, toolset: gcc,   std: c++20 }
          - { os: ubuntu-26.04-arm, toolset: gcc,   std: c++14 }
          - { os: ubuntu-26.04-arm, toolset: gcc,   std: c++23 }
          - { os: ubuntu-24.04,     toolset: clang, std: c++14 }
          - { os: ubuntu-24.04,     toolset: clang, std: c++20 }
          - { os: ubuntu-26.04,     toolset: clang, std: c++14 }
          - { os: ubuntu-26.04,     toolset: clang, std: c++23 }
          - { os: ubuntu-24.04-arm, toolset: clang, std: c++14 }
          - { os: ubuntu-24.04-arm, toolset: clang, std: c++20 }
          - { os: ubuntu-26.04-arm, toolset: clang, std: c++14 }
          - { os: ubuntu-26.04-arm, toolset: clang, std: c++23 }

    name: ${{ matrix.toolset }}, ${{ matrix.std }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    # The worst empirical run-time of this job is about 2m30s.
    timeout-minutes: 5

    env:
      make: make -R TOOLSET=${{ matrix.toolset }} CXXFLAGS=-std=${{ matrix.std }}

    steps:
    - uses: actions/checkout@v7

    - name: Enable transparent huge pages
      run: source scripts/util.sh && enable_thp

    - name: Install Boost.Test
      run: |
        sudo apt-get update
        sudo apt-get install --yes -qq libboost-test-dev

    - name: Environment info
      run: |
        ${{ env.make }} env
        echo "n_proc=$(nproc)" >> "$GITHUB_ENV"
        cat /proc/cpuinfo

    - name: Toolset versions
      run: ${{ env.make }} versions

    - name: Unit-test
      run: ${{ env.make }} -j${{ env.n_proc }} run_ci

    - name: Unit-test with address sanitizer
      run: ${{ env.make }} -j${{ env.n_proc }} BUILD=sanitize2 run_ci

    - name: Unit-test with thread sanitizer
      run: ${{ env.make }} -j${{ env.n_proc }} BUILD=sanitize run_ci

    - name: Benchmark
      if: ${{ env.n_proc > 1 }}
      run: |
        ulimit -Sl unlimited
        sudo sysctl kernel.sched_rt_runtime_us=-1
        ${{ env.make }} -j${{ env.n_proc }} run_benchmarks_ci
