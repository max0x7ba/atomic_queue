# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake Continuous Integrations

on:
  push:
    branches: [ "master", "CMake-support", "maxim" ]
    paths:
      - '**.h'
      - '**.cc'
      - '**/CMakeLists.txt'
      - .github/workflows/cmake-gcc-clang.yml
  pull_request:
    branches: [ "master" ]
    paths:
      - '**.h'
      - '**.cc'
      - '**/CMakeLists.txt'
      - .github/workflows/cmake-gcc-clang.yml

env:
  # Enable printf thousand separators.
  LC_NUMERIC: en_US.UTF-8

jobs:
  build:
    name: ${{ matrix.os }}, ${{ matrix.compiler.cpp }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        include:
          # --- Linux x64 ---
          - os: ubuntu-latest
            build_type: Release
            compiler: { c: gcc, cpp: g++ }

          - os: ubuntu-latest
            build_type: Release
            compiler: { c: clang, cpp: clang++ }

          # --- Linux ARM ---
          - os: ubuntu-24.04-arm
            build_type: Release
            compiler: { c: gcc, cpp: g++ }

          - os: ubuntu-24.04-arm
            build_type: Release
            compiler: { c: clang, cpp: clang++ }

          # --- macOS ---
          - os: macos-latest
            build_type: Release
            compiler: { c: clang, cpp: clang++ }

          # --- Windows ---
          - os: windows-latest
            build_type: Release
            compiler: { c: cl, cpp: cl }

    steps:
    - uses: actions/checkout@v7

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Install boost on linux
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        sudo apt-get update
        sudo apt-get install --yes -qq libboost-test-dev

    - name: Install boost on macos
      if: startsWith(matrix.os, 'macos')
      run: |
        brew install boost

    - name: Install boost on windows
      if: startsWith(matrix.os, 'windows') && matrix.compiler.cpp == 'cl'
      uses: MarkusJx/install-boost@v2.6.0
      id: install-boost-windows
      with:
        boost_version: 1.89.0
        platform_version: 2025
        toolset: msvc

    - name: Configure CMake Unix (Linux/macOS)
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      if: startsWith(matrix.os, 'ubuntu') || startsWith(matrix.os, 'macos')
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cpp }}
        -DCMAKE_C_COMPILER=${{ matrix.compiler.c }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_RULE_MESSAGES=OFF
        -DATOMIC_QUEUE_BUILD_TESTS=ON
        -DATOMIC_QUEUE_BUILD_EXAMPLES=ON
        -DATOMIC_QUEUE_BUILD_BENCHMARKS_MIN=${{ case(startsWith(matrix.os, 'ubuntu'), 'ON', 'OFF') }}
        -S ${{ github.workspace }}

    - name: Configure CMake Windows - MSVC
      if: startsWith(matrix.os, 'windows') && matrix.compiler.cpp == 'cl'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_RULE_MESSAGES=OFF
        -DATOMIC_QUEUE_BUILD_TESTS=ON
        -DATOMIC_QUEUE_BUILD_EXAMPLES=ON
        -S ${{ github.workspace }}
        -DBOOST_ROOT=${{steps.install-boost-windows.outputs.BOOST_ROOT}}

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --verbose --config ${{ matrix.build_type }}

    - name: Unit-test${{ case(startsWith(matrix.os, 'ubuntu'), ' and benchmark', '') }}
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest -j1 --timeout 300 -V --build-config ${{ matrix.build_type }} --test-dir ${{ steps.strings.outputs.build-output-dir }}
